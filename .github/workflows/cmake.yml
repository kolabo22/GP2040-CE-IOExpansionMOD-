name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
          
      - name: Verify cmake
        run: cmake --version

      # Global Setup
      - name: Checkout GP2040-CE
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: arm-none-eabi-gcc GNU Arm Embedded Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Checkout pico-sdk/2.2.0
        uses: actions/checkout@v6.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk

      - name: Checkout pico-sdk submodules
        working-directory: ${{github.workspace}}/pico-sdk
        run: git submodule update --init

      # ==========================================================
      # 🛡️ MINI Super 専用・画面パッチ強制コンパイルステップ
      # 外部からの空っぽな画面データのダウンロードを完全に遮断し、
      # 私たちが書き換えた AddonsConfigPage.tsx をその場でナマでJavaScript化します。
      # ==========================================================
      - name: Build Web Configurator
        run: |
          cd www
          npm ci
          npm run build
          cd ..

      - name: Get core count
        id: core_count
        run: echo "output=$(cat /proc/cpuinfo | grep processor | wc -l)" >> $GITHUB_OUTPUT
        # End Global Setup

      - name: Pico Build Configure CMake
        shell: bash
        run: |
          PICO_SDK_PATH=${{github.workspace}}/pico-sdk \
          GP2040_BOARDCONFIG="FightingStickMiniSuper" \
          SKIP_WEBBUILD=TRUE \
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Pico Build
        shell: bash
        run: |
          GP2040_BOARDCONFIG="FightingStickMiniSuper" \
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel ${{steps.core_count.outputs.output}} --target GP2040-CE

      - name: Upload Pico Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GP2040-CE - MINI Super Dedicated
          path: ${{github.workspace}}/build/GP2040-CE_*_FightingStickMiniSuper.uf2
          if-no-files-found: error
